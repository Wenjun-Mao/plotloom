name: CI

on:
  workflow_dispatch:
    inputs:
      browser_grep:
        description: "Browser test-name regex (.* is the full release gate; any filter is diagnostic only)"
        required: true
        default: ".*"
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # The retained-runtime inventory compares fixed historical commits.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/prompt-pipeline-lab/package-lock.json

      - name: Install Python dependencies
        run: uv sync --all-groups --frozen
      - name: Check API unused imports
        run: uv run ruff check src/plotloom/api --select F401
      - name: Install P2 media probe tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Verify archived prompt reader
        run: |
          npm --prefix docs/prompt-pipeline-lab ci
          npm --prefix docs/prompt-pipeline-lab run verify
      - name: Frontend unit and type contracts
        run: |
          npm --prefix frontend test
          npm --prefix frontend run typecheck
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Verify checked production bundle
        run: git diff --exit-code -- src/plotloom/static
      - name: Python and distribution contracts
        # The full serial suite exceeded the old job budget while still advancing.
        # Bound this step separately and retain time for wheel/smoke qualification.
        timeout-minutes: 45
        run: uv run pytest -q --durations=20
      - name: Build wheel
        run: uv build --wheel
      - name: Smoke installed wheel
        run: uv run python scripts/smoke_installed_wheel.py dist

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser fixture dependencies
        run: |
          uv sync --all-groups --frozen
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm --prefix frontend ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify browser shard allocation and selected case coverage
        working-directory: frontend
        env:
          BROWSER_GREP: ${{ inputs.browser_grep }}
        run: node scripts/check_browser_shard_manifest.mjs
      - name: Browser regression contracts
        # Keep one real fixture stack per runner; distribute whole specs by duration.
        # Playwright must finalize reports before the step/job cancellation budget.
        timeout-minutes: 45
        env:
          BROWSER_GREP: ${{ inputs.browser_grep }}
          BROWSER_SHARD: ${{ matrix.shard }}
        run: npm --prefix frontend run test:e2e -- --workers=1 --grep="${BROWSER_GREP}" --global-timeout=2400000 --pass-with-no-tests
      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: frontend/test-results
          retention-days: 7
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7
