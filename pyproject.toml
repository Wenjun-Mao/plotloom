[project]
name = "plotloom"
version = "0.1.0"
description = "Plotloom · 叙织 — a local-first, contract-driven story-to-storyboard workbench"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Wenjun Mao", email = "mkof616@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
plotloom = "plotloom.runtime:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "plotloom"

[tool.pytest.ini_options]
testpaths = ["tests"]
