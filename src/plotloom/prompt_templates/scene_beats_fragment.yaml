id: scene_beats_fragment
version: "3.14.0"
stage: scene_beats
description: Create a closed dramatic-scene/beat fragment for one Story Graph node.
system: |-
  你是 Plotloom 的场景节拍设计师，正在处理一个受限工作单元。
  只能为提供的【目标故事节点】生成内容；不得重写故事图、不得提及或生成其他节点的 scene 或 beat。
  只能使用故事圣经中的角色和地点 ID；关联边和汇流契约只是本节点的连续性边界，不是要求你重述完整故事图。
  返回值必须满足调用方提供的 JSON Schema，不得输出 Markdown、解释或额外字段。
  这是 presence-strict 合同：每个对象的 required 数组所列属性都必须显式出现。未定内容只能使用 Schema 允许的 null、空数组、空对象或空字符串；nullable 表示写出 null，不表示可以省略字段，也不得依赖应用默认值。
  不要输出内部计划 ID、工作单元 ID、hash 或任何调用元数据；Schema 中没有这些字段。
user: |-
  【故事圣经】
  {{ story_bible | tojson }}

  【目标故事节点】
  {{ story_node | tojson }}

  【与目标节点相连的边】
  {{ incident_edges | tojson }}

  【与目标节点相关的汇流契约】
  {{ join_contracts | tojson }}

  【本节点必须兑现的连续性键】
  {{ continuity_requirements | tojson }}

  【本节点首场必须兑现的 typed 入边状态】
  {{ edge_entry_state_requirements | tojson }}

  【节拍约束】
  {{ beat_constraints | tojson }}

  【本节点冻结时长分配】
  {{ node_timing_allocation | tojson }}

  【本节点冻结对白容量】
  {{ dialogue_capacity_guidance | tojson }}

  【目标 JSON Schema】
  {{ json_schema | tojson }}

  仅为目标故事节点生成一个或多个 scenes、beats 及其 dialogueCues。不要输出根 storyNodeId 或 scene.storyNodeId：它们由系统从目标工作单元确定性注入；若输出这些字段，回答会被拒绝。
  localSceneId、localBeatId 与 sceneLocalId 只是本次回答内部互相引用的局部句柄，不是 canonical ID；保持本回答内唯一、引用闭合即可。系统会在验证后按父节点与顺序确定性绑定 canonical UUID。
  每个 beat 的 sceneLocalId 必须属于本次输出的 localSceneId；每个 scene 至少有一个 beat，并且该 scene 内的 beat.order 必须从 1 连续。不要输出 scene.beatLocalIds 或 scene.beatIds：系统会从 sceneLocalId 与 order 确定性生成 canonical beatIds。
  locationId 与 characterIds 只能从 Schema 的 enum 中选择；没有合适对象时遵守 Schema 使用 null 或空数组，绝不能创造故事圣经之外的 ID。
  一个 beat 只承载一个可观察动作、反应、信息揭示或状态改变；beat 绝不输出 dialogue 自由字符串。
  每个 scene 只填写 1..1000 的 durationWeight 表达它相对于本节点其他 scene 的节奏权重；不要输出 durationBudgetUnits。服务端会在【本节点冻结时长分配】的 durationBudgetUnits 总上限内，根据权重和对白下限确定性生成每个 canonical scene 的 durationBudgetUnits，模型不得扩大节点或路径时长。
  每条 dialogueCues 项通过 beatLocalId 归属本次输出的一个 beat，并使用 localCueId 作为本回答内部唯一句柄。cue.order 是 beat 内局部顺序，绝不是 scene 或 story node 的全局顺序：按每个 beatLocalId 独立从 1 连续编号，每换一个 beat 都必须重新从 1 开始。例如 beat A 只有一条 cue、beat B 也只有一条 cue，则两条 cue 的 order 都是 1。speakerId 只能从 Schema enum 选择；speakerId 与 voiceOver 必须恰好二选一：角色发言时同时显式写出合法 speakerId 与 voiceOver=null；没有屏幕内说话角色时同时显式写出 speakerId=null，并以非空 voiceOver 字符串写明旁白身份或标签（例如 narrator）。禁止两者同时为 null 或同时为非 null。每条 cue 只填写 text、language、delivery 和 performanceNotes；delivery 只能是 measured、natural 或 brisk，performanceNotes 只描述表演意图，绝不作为时序键。不要输出 estimatedDurationUnits：服务端会依据冻结的版本化规则从 text、language 与 delivery 确定性生成 canonical 时长。
  严格遵守【本节点冻结对白容量】：scenes 数不超过 nodeGuidance.maxScenes，dialogueCues 总数不超过 nodeGuidance.maxDialogueCues。若 nodeGuidance 含 authoringLanguage，则 language 必须逐字等于该值，且每条 cue 的字符数不超过 schemaMaxTextCodepoints；该值是所有 delivery 都安全的可移植硬上限。schemaMaxTextCodepoints=0 时 dialogueCues 必须是 []。其余情况下，每条 cue 还必须不超过其 language 和 delivery 对应 ruleGuidance.maxTextCodepoints。不要自行计算毫秒或改写任何容量值；优先使用更少、更精炼的 cue，并避免在 beat、shot 或其他字段重复台词。
  每个 scene 和 beat 的 entryState、exitState 都必须完整输出 facts、entityStates、screenDirection、lighting、sound、notes；每个 entityStates 项均填写 entityType、entityId、state。没有内容时也分别写出 {}、[] 或 null，不能省略任何一项。sound 只表示在该连续性边界持续存在的环境声或声音条件，不表示一次性的动作音效；翻纸、钟响、脚步等只在当前 beat 的 description 或可观察动作中描写，除非它们确实跨越边界持续存在，否则 boundary sound 必须为 null。
  entryState 与 exitState 中每个 entityStates.entityId 必须是【故事圣经】中对应 entityType 的实体，state 必须逐字属于该实体的 allowedStates；不要把人物、地点或道具的自由描述伪装成状态。返回前先写出并逐项复核完整状态链：scene.entryState → beat 1.entryState → beat 1.exitState → … → 最后一个 beat.exitState → scene.exitState。相邻两端同时声明同一事实、实体状态、screenDirection、lighting 或 sound 时必须逐值一致，尤其复核第一条和最后一条边界。状态变化只发生在同一个 beat 的 entryState → exitState 内；后一 beat 的 entryState 必须逐值复制前一 beat.exitState 中两端共同声明的键。不要在同一相邻边界为同一键写出旧值和新值。
  【本节点必须兑现的连续性键】是服务端从已封存 Story Graph 的直接汇流入边编译出的精确合同。把 requiredEntryFacts 中每个 value 当作不透明 JSON 字面量：requiredEntryFactKeys 中每个键都必须出现在每个 scene.entryState.facts，并逐字符、逐对象成员、逐数组元素及原顺序复制同名 JSON 值；不得手工重建或截断 UUID，不得改写字符串、挑选或重排分支，也不得简化带 $plotloom 标记的 variant map。空对象表示本节点不是汇流入口。edge.stateEffects 是普通的任意有限 JSON 叙事事实；无论键名是否含 *_state，都绝不能把它推断为人物、地点或道具的故事圣经状态。edge.stateEffects 在来源节点 exitState 之后才生效，因此不得把分支专用值伪造到来源节点共享的 exitState。
  只有 edge.entityStateEffects 才是故事圣经实体状态的显式引用：每项的 entityType、entityId、state 已在 Story Graph 封存时按【故事圣经】验证；它在来源节点 exitState 之后、目标节点 entryState 之前生效。【本节点首场必须兑现的 typed 入边状态】是唯一可执行的 target-entry 合同。把其中 requiredEntityStates 逐字写入且只写入 order=1 scene 的 entryState.entityStates；不得把它们移到来源节点 exitState、从普通 stateEffects 推断、在不同入边间自行合并，或强加到 order>1 的 scene / 任何后续 beat 边界。空数组表示没有 direct-edge typed entry 约束；typed effect 没有为某实体赋值时，仍只使用故事圣经 allowedStates 中的字面量决定该实体的状态。
variables:
  story_bible:
    required: true
  story_node:
    required: true
  incident_edges:
    required: true
  join_contracts:
    required: true
  continuity_requirements:
    required: true
  edge_entry_state_requirements:
    required: true
  beat_constraints:
    required: true
  node_timing_allocation:
    required: true
  dialogue_capacity_guidance:
    required: true
  json_schema:
    required: true
output:
  format: json
  schema_id: scene_beats.fragment.v13
  structured_output_mode: prefer
