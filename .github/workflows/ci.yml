name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The retained-runtime inventory compares fixed historical commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/prompt-pipeline-lab/package-lock.json

      - name: Install Python dependencies
        run: uv sync --all-groups --frozen
      - name: Install P2 media probe tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Verify archived prompt reader
        run: |
          npm --prefix docs/prompt-pipeline-lab ci
          npm --prefix docs/prompt-pipeline-lab run verify
      - name: Frontend unit and type contracts
        run: |
          npm --prefix frontend test
          npm --prefix frontend run typecheck
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Verify checked production bundle
        run: git diff --exit-code -- src/plotloom/static
      - name: Python and distribution contracts
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Smoke installed wheel
        run: uv run python scripts/smoke_installed_wheel.py dist
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression contracts
        # Each worker runs full fixture stacks; serialize CI to bound resource demand.
        # Contention remains a hypothesis pending a fresh CI run.
        run: npm --prefix frontend run test:e2e -- --workers=1
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
