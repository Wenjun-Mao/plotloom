services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: plotloom-h3-gateway:20261022-service-boundaries
    container_name: plotloom-h3-gateway
    env_file: .env
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${H3_GATEWAY_DATA_HOST_DIR}:/var/lib/plotloom-h3-gateway
      - ${H3_COMFY_INPUT_HOST_DIR}:/comfy/input
      - ${H3_COMFY_OUTPUT_HOST_DIR}:/comfy/output
