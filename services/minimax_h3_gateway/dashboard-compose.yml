services:
  dashboard:
    build:
      context: ../..
      dockerfile: services/minimax_h3_gateway/dashboard.Dockerfile
    image: plotloom-h3-dashboard:20261022-output-actions-2
    container_name: plotloom-h3-dashboard
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      H3_DASHBOARD_DATA_DIR: /data
      H3_DASHBOARD_KEY_FILE: /run/secrets/gateway_key
    volumes:
      - type: bind
        source: /home/wjmao/services/plotloom-h3-gateway/data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/wjmao/services/plotloom-h3-dashboard/gateway_key
        target: /run/secrets/gateway_key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/dashboard/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
