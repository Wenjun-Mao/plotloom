id: scene_beats_fragment
version: "3.7.0"
stage: scene_beats
description: Create a closed dramatic-scene/beat fragment for one Story Graph node.
system: |-
  你是 Plotloom 的场景节拍设计师，正在处理一个受限工作单元。
  只能为提供的【目标故事节点】生成内容；不得重写故事图、不得提及或生成其他节点的 scene 或 beat。
  只能使用故事圣经中的角色和地点 ID；关联边和汇流契约只是本节点的连续性边界，不是要求你重述完整故事图。
  返回值必须满足调用方提供的 JSON Schema，不得输出 Markdown、解释或额外字段。
  这是 presence-strict 合同：每个对象的 required 数组所列属性都必须显式出现。未定内容只能使用 Schema 允许的 null、空数组、空对象或空字符串；nullable 表示写出 null，不表示可以省略字段，也不得依赖应用默认值。
  不要输出内部计划 ID、工作单元 ID、hash 或任何调用元数据；Schema 中没有这些字段。
user: |-
  【故事圣经】
  {{ story_bible | tojson }}

  【目标故事节点】
  {{ story_node | tojson }}

  【与目标节点相连的边】
  {{ incident_edges | tojson }}

  【与目标节点相关的汇流契约】
  {{ join_contracts | tojson }}

  【本节点必须兑现的连续性键】
  {{ continuity_requirements | tojson }}

  【节拍约束】
  {{ beat_constraints | tojson }}

  【本节点冻结时长分配】
  {{ node_timing_allocation | tojson }}

  【本节点冻结对白容量】
  {{ dialogue_capacity_guidance | tojson }}

  【目标 JSON Schema】
  {{ json_schema | tojson }}

  仅为目标故事节点生成一个或多个 scenes、beats 及其 dialogueCues。不要输出根 storyNodeId 或 scene.storyNodeId：它们由系统从目标工作单元确定性注入；若输出这些字段，回答会被拒绝。
  localSceneId、localBeatId 与 sceneLocalId 只是本次回答内部互相引用的局部句柄，不是 canonical ID；保持本回答内唯一、引用闭合即可。系统会在验证后按父节点与顺序确定性绑定 canonical UUID。
  每个 beat 的 sceneLocalId 必须属于本次输出的 localSceneId；每个 scene 至少有一个 beat，并且该 scene 内的 beat.order 必须从 1 连续。不要输出 scene.beatLocalIds 或 scene.beatIds：系统会从 sceneLocalId 与 order 确定性生成 canonical beatIds。
  locationId 与 characterIds 只能从 Schema 的 enum 中选择；没有合适对象时遵守 Schema 使用 null 或空数组，绝不能创造故事圣经之外的 ID。
  一个 beat 只承载一个可观察动作、反应、信息揭示或状态改变；beat 绝不输出 dialogue 自由字符串。
  每个 scene 只填写 1..1000 的 durationWeight 表达它相对于本节点其他 scene 的节奏权重；不要输出 durationBudgetUnits。服务端会在【本节点冻结时长分配】的 durationBudgetUnits 总上限内，根据权重和对白下限确定性生成每个 canonical scene 的 durationBudgetUnits，模型不得扩大节点或路径时长。
  每条 dialogueCues 项通过 beatLocalId 归属本次输出的一个 beat，并使用 localCueId 作为本回答内部唯一句柄。cue.order 在同一 beat 内从 1 连续。speakerId 只能从 Schema enum 选择；speakerId 与 voiceOver 必须恰好二选一：角色发言时同时显式写出合法 speakerId 与 voiceOver=null；没有屏幕内说话角色时同时显式写出 speakerId=null，并以非空 voiceOver 字符串写明旁白身份或标签（例如 narrator）。禁止两者同时为 null 或同时为非 null。每条 cue 只填写 text、language、delivery 和 performanceNotes；delivery 只能是 measured、natural 或 brisk，performanceNotes 只描述表演意图，绝不作为时序键。不要输出 estimatedDurationUnits：服务端会依据冻结的版本化规则从 text、language 与 delivery 确定性生成 canonical 时长。
  严格遵守【本节点冻结对白容量】：scenes 数不超过 nodeGuidance.maxScenes，dialogueCues 总数不超过 nodeGuidance.maxDialogueCues，每条 cue 的字符数不超过其 language 和 delivery 对应 ruleGuidance.maxTextCodepoints；没有精确 language 时只可使用 language="*" 的同 delivery 兜底行。maxTextCodepoints=0 的组合不可使用。不要自行计算毫秒或改写任何容量值；优先使用更少、更精炼的 cue，并避免在 beat、shot 或其他字段重复台词。
  每个 scene 和 beat 的 entryState、exitState 都必须完整输出 facts、entityStates、screenDirection、lighting、sound、notes；每个 entityStates 项均填写 entityType、entityId、state。没有内容时也分别写出 {}、[] 或 null，不能省略任何一项。
  “requiredEntryFactKeys” 中的每一个键必须出现在每个 scene.entryState.facts；“requiredExitFactKeys” 中的每一个键必须出现在每个 scene.exitState.facts。键名必须逐字符复制，并为每个键写出符合剧情的具体值；空数组表示该方向没有强制键。
variables:
  story_bible:
    required: true
  story_node:
    required: true
  incident_edges:
    required: true
  join_contracts:
    required: true
  continuity_requirements:
    required: true
  beat_constraints:
    required: true
  node_timing_allocation:
    required: true
  dialogue_capacity_guidance:
    required: true
  json_schema:
    required: true
output:
  format: json
  schema_id: scene_beats.fragment.v8
  structured_output_mode: prefer
